<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder - Email Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen bg-white antialiased flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-[420px] flex flex-col items-center justify-center space-y-6">

    <!-- โลโก้ -->
    <a href="index.html" class="w-60 md:w-64 h-auto flex items-center justify-center">
      <img src="logo.png" alt="Dorm Finder Logo" class="w-full h-auto object-contain">
    </a>

    <!-- การ์ดกรอกอีเมล -->
    <form action="verify-otp.html" method="GET" class="w-full bg-[#D8D8D8] rounded-[32px] p-6 md:p-8 space-y-5 shadow-sm">
      
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-black">เข้าสู่ระบบด้วยอีเมล</h2>
        <p class="text-xs text-gray-600">เราจะส่งรหัสยืนยัน (OTP) 6 หลักไปยังอีเมลของคุณ</p>
      </div>

      <!-- ช่องกรอกอีเมล -->
      <div class="w-full h-12 bg-white rounded-full flex items-center overflow-hidden shadow-sm">
        <div class="w-12 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <input type="email" name="email" required placeholder="ระบุอีเมลของคุณ" class="w-full h-full px-4 text-base font-normal text-black placeholder-gray-400 outline-none bg-transparent">
      </div>

      <!-- ปุ่มส่งรหัส -->
      <div class="flex justify-center pt-2">
        <button type="submit" class="w-full h-12 bg-[#0058A6] hover:bg-[#004480] text-white rounded-full text-lg font-bold transition flex items-center justify-center shadow-sm cursor-pointer">
          ส่งรหัสยืนยัน
        </button>
      </div>

    </form>

    <div class="w-full text-center space-x-2">
      <a href="login.html" class="text-xs md:text-sm font-normal text-black hover:underline">เข้าสู่ระบบด้วยรหัสผ่าน</a>
      <span class="text-gray-400">|</span>
      <a href="index.html" class="text-xs md:text-sm font-normal text-black hover:underline">ย้อนกลับ</a>
    </div>

  </div>

</body>
</html>
