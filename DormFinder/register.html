<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen bg-white antialiased flex flex-col items-center justify-center p-3 md:py-6">

  <div class="w-full max-w-[420px] flex flex-col items-center justify-center space-y-4">

    <a href="index.html" class="w-52 md:w-56 h-auto flex items-center justify-center">
      <img src="logo.png" alt="Dorm Finder Logo" class="w-full h-auto object-contain">
    </a>

    <form action="login.html" method="GET" class="w-full bg-[#D8D8D8] rounded-[32px] p-5 md:p-6 space-y-3.5 shadow-sm">
      
      <div class="w-full h-11 bg-white rounded-full flex items-center overflow-hidden shadow-sm">
        <div class="w-11 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <input type="text" required placeholder="ชื่อผู้ใช้" class="w-full h-full px-4 text-sm font-normal text-black placeholder-gray-400 outline-none bg-transparent">
      </div>

      <div class="w-full h-11 bg-white rounded-full flex items-center overflow-hidden shadow-sm">
        <div class="w-11 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
        </div>
        <input type="email" required placeholder="อีเมล" class="w-full h-full px-4 text-sm font-normal text-black placeholder-gray-400 outline-none bg-transparent">
      </div>

      <div class="w-full h-11 bg-white rounded-full flex items-center overflow-hidden shadow-sm">
        <div class="w-11 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
          </svg>
        </div>
        <input type="tel" required placeholder="เบอร์โทรศัพท์" class="w-full h-full px-4 text-sm font-normal text-black placeholder-gray-400 outline-none bg-transparent">
      </div>

      <div class="w-full h-11 bg-white rounded-full flex items-center overflow-hidden shadow-sm relative pr-3">
        <div class="w-11 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <input id="password" type="password" required placeholder="รหัสผ่าน" class="w-full h-full px-4 text-sm font-normal text-black placeholder-gray-400 outline-none bg-transparent">
        
        <button type="button" onclick="togglePass('password', 'eyeOpen1', 'eyeClosed1')" class="text-gray-500 hover:text-black focus:outline-none p-1 cursor-pointer">
          <svg id="eyeOpen1" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg id="eyeClosed1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 013.25-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
          </svg>
        </button>
      </div>

      <div class="w-full h-11 bg-white rounded-full flex items-center overflow-hidden shadow-sm relative pr-3">
        <div class="w-11 h-full bg-[#0058A6] flex items-center justify-center text-white flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
        </div>
        <input id="confirmPassword" type="password" required placeholder="ยืนยันรหัสผ่าน" class="w-full h-full px-4 text-sm font-normal text-black placeholder-gray-400 outline-none bg-transparent">
        
        <button type="button" onclick="togglePass('confirmPassword', 'eyeOpen2', 'eyeClosed2')" class="text-gray-500 hover:text-black focus:outline-none p-1 cursor-pointer">
          <svg id="eyeOpen2" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg id="eyeClosed2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.02 10.02 0 013.25-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
          </svg>
        </button>
      </div>

      <div class="flex justify-center pt-1 pb-0.5">
        <button type="submit" class="w-48 h-11 bg-[#0058A6] hover:bg-[#004480] text-white rounded-full text-base font-bold transition flex items-center justify-center shadow-sm cursor-pointer">
          สมัครสมาชิก
        </button>
      </div>

      <div class="relative flex py-0.5 items-center justify-center">
        <div class="flex-grow border-t border-gray-400"></div>
        <span class="flex-shrink mx-3 text-xs md:text-sm text-black font-normal">สมัครสมาชิกด้วย</span>
        <div class="flex-grow border-t border-gray-400"></div>
      </div>

      <div class="w-full h-11 bg-[#D8D8D8] border border-black rounded-full px-2 flex items-center justify-between">
        <a href="login-email.html" class="flex-1 h-full flex items-center justify-center space-x-2 text-black hover:opacity-75 transition">
          <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <span class="text-sm font-bold text-black">อีเมล</span>
        </a>

        <div class="w-[1px] h-5 bg-gray-400"></div>

        <a href="https://accounts.google.com" class="flex-1 h-full flex items-center justify-center space-x-2 text-black hover:opacity-75 transition">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
          </svg>
          <span class="text-sm font-bold text-black">Google</span>
        </a>
      </div>

    </form>

    <div class="w-full text-center">
      <span class="text-xs md:text-sm font-normal text-black">มีบัญชีอยู่แล้ว? </span>
      <a href="login.html" class="text-xs md:text-sm font-bold text-[#00BCD4] hover:underline cursor-pointer">เข้าสู่ระบบ</a>
    </div>

  </div>

  <script>
    function togglePass(inputId, openIconId, closedIconId) {
      const input = document.getElementById(inputId);
      const openIcon = document.getElementById(openIconId);
      const closedIcon = document.getElementById(closedIconId);

      if (input.type === 'password') {
        input.type = 'text';
        openIcon.classList.remove('hidden');
        closedIcon.classList.add('hidden');
      } else {
        input.type = 'password';
        openIcon.classList.add('hidden');
        closedIcon.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
