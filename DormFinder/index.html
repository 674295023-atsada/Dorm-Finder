<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder - Welcome</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Kanit', sans-serif; 
      background-color: #FFFFFF;
    }
  </style>
</head>
<body class="min-h-screen bg-white antialiased flex items-center justify-center p-4">

  <!-- Desktop Layout (จัดวางแนวตั้งกึ่งกลางตามรูปภาพ ไม่มีพื้นหลังสีเทา) -->
  <div class="hidden md:flex w-full max-w-[360px] flex-col items-center justify-center space-y-6 my-8">
    
    <!-- โลโก้และข้อความต้อนรับ -->
    <div class="flex flex-col items-center justify-center w-full">
      <a href="index.html" class="w-56 h-auto mb-2 flex items-center justify-center">
        <img src="logo.png" alt="Dorm Finder Logo" class="w-full h-auto object-contain">
      </a>
      <div class="text-center space-y-1">
        <p class="text-2xl font-normal text-black leading-snug">
          ยินดีต้อนรับเข้าสู่ <span class="text-[#0058A6]">Dorm Finder</span>
        </p>
        <p class="text-2xl font-normal text-black leading-snug">
          ค้นหาหอพักและรูมเมทที่ใช่ด้วย AI
        </p>
      </div>
    </div>

    <!-- ปุ่มปุ่ม และ Social Login -->
    <div class="w-full space-y-4">
      <!-- ปุ่มเข้าสู่ระบบ -->
      <a href="login.html" class="w-full h-14 bg-[#0058A6] hover:bg-[#004480] text-white rounded-full text-2xl font-bold active:opacity-90 transition shadow-sm flex items-center justify-center">
        เข้าสู่ระบบ
      </a>

      <!-- ปุ่มสมัครสมาชิก -->
      <a href="register.html" class="w-full h-14 bg-white hover:bg-cyan-50 text-[#00BCD4] border-2 border-[#00BCD4] rounded-full text-2xl font-bold active:bg-cyan-100 transition flex items-center justify-center">
        สมัครสมาชิก
      </a>

      <!-- เส้น Divider -->
      <div class="relative flex py-2 items-center justify-center">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="flex-shrink mx-4 text-base text-black font-normal">เข้าสู่ระบบด้วย</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>

      <!-- ปุ่ม Social Login -->
      <div class="w-full h-14 bg-[#D9D9D9] rounded-full px-4 flex items-center justify-between">
        <a href="login-email.html" class="flex-1 h-full flex items-center justify-center space-x-2 text-black hover:opacity-75 transition">
          <svg class="w-8 h-5" viewBox="0 0 36 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="24" rx="5" fill="black"/>
            <path d="M6 7.5L18 15.5L30 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="text-xl font-normal tracking-wide">อีเมล</span>
        </a>
        <div class="w-[1px] h-7 bg-gray-400 opacity-60"></div>
        <a href="https://accounts.google.com" class="flex-1 h-full flex items-center justify-center space-x-2 text-black hover:opacity-75 transition">
          <svg class="w-7 h-7" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
          </svg>
          <span class="text-xl font-normal tracking-wide">Google</span>
        </a>
      </div>
    </div>

  </div>

  <!-- Mobile Layout (คงตามเดิม) -->
  <div class="flex md:hidden w-full h-[100dvh] px-8 pt-20 pb-12 flex-col justify-between items-center relative bg-white">
    <div class="flex flex-col items-center justify-center w-full mt-2">
      <a href="index.html" class="w-52 h-auto mb-1.5 flex items-center justify-center">
        <img src="logo.png" alt="Dorm Finder Logo" class="w-full h-auto object-contain">
      </a>
      <div class="text-center space-y-1 -mt-2">
        <p class="text-[19px] font-normal text-black leading-snug">
          ยินดีต้อนรับเข้าสู่ <span class="text-[#0058A6]">Dorm Finder</span>
        </p>
        <p class="text-[19px] font-normal text-black leading-snug">
          ค้นหาหอพักและรูมเมทที่ใช่ด้วย AI
        </p>
      </div>
    </div>

    <div class="w-full max-w-[320px] mx-auto space-y-4 mb-2">
      <a href="login.html" class="w-full h-14 bg-[#0058A6] text-white rounded-full text-[22px] font-bold active:opacity-90 transition leading-none flex items-center justify-center">
        เข้าสู่ระบบ
      </a>

      <a href="register.html" class="w-full h-14 bg-white text-[#00BCD4] border-2 border-[#00BCD4] rounded-full text-[22px] font-bold active:bg-cyan-50 transition leading-none flex items-center justify-center">
        สมัครสมาชิก
      </a>

      <div class="relative flex py-1 items-center justify-center">
        <div class="flex-grow border-t border-gray-300"></div>
        <span class="flex-shrink mx-4 text-[16px] text-black font-normal">เข้าสู่ระบบด้วย</span>
        <div class="flex-grow border-t border-gray-300"></div>
      </div>

      <div class="w-full h-14 bg-[#D9D9D9] rounded-full px-3 flex items-center justify-between">
        <a href="login-email.html" class="flex-1 h-full flex items-center justify-center space-x-2 text-black">
          <svg class="w-8 h-5" viewBox="0 0 36 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="24" rx="5" fill="black"/>
            <path d="M6 7.5L18 15.5L30 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="text-[19px] font-normal text-black leading-none">อีเมล</span>
        </a>
        <div class="w-[1px] h-6 bg-gray-400 opacity-60"></div>
        <a href="https://accounts.google.com" class="flex-1 h-full flex items-center justify-center space-x-2 text-black">
          <svg class="w-7 h-7" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
          </svg>
          <span class="text-[19px] font-normal text-black leading-none">Google</span>
        </a>
      </div>
    </div>
  </div>

</body>
</html>
