<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Finder - รายการโปรด</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          },
          colors: {
            primary: '#0F6CBD',
            secondary: '#00BCD4',
            grayPlaceholder: '#D8D8D8',
            cardGray: '#E5E5E5',
            linkBlue: '#0075FF'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      background-color: #F8FAFC;
    }
  </style>
</head>
<body class="min-h-screen text-gray-800 antialiased pb-20 md:pb-10 bg-slate-50 flex flex-col justify-between">

  <!-- ================= DESKTOP HEADER ================= -->
  <header class="hidden md:block bg-primary text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-3.5 flex items-center justify-between">
      <a href="home.html" class="flex items-center gap-2 text-xl font-bold tracking-wide hover:opacity-90 transition">
        <svg class="w-8 h-8 text-secondary" fill="currentColor" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Dorm Finder</span>
      </a>

      <nav class="flex items-center gap-8 text-sm font-medium">
        <a href="home.html" class="text-white/80 hover:text-white transition py-1">หน้าหลัก</a>
        <a href="matching.html" class="text-white/80 hover:text-white transition py-1">ค้นหารูมเมท</a>
        <a href="detail.html?id=1" class="text-white/80 hover:text-white transition py-1">หอพัก</a>
        <a href="messages.html" class="text-white/80 hover:text-white transition py-1">ข้อความ</a>
        <a href="profile.html" class="text-white font-bold transition py-1 border-b-2 border-white">โปรไฟล์ของฉัน</a>
      </nav>

      <div class="relative w-64">
        <input type="text" placeholder="ค้นหา..." class="w-full pl-9 pr-4 py-1.5 bg-white/10 text-white placeholder-white/60 rounded-full text-xs border border-white/20 focus:outline-none focus:bg-white focus:text-gray-800 transition">
        <svg class="w-4 h-4 text-white/70 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- ================= MOBILE HEADER ================= -->
  <header class="md:hidden bg-primary text-white px-4 py-3.5 flex items-center justify-between sticky top-0 z-40 shadow-sm">
    <div class="flex items-center gap-3">
      <a href="profile.html" class="p-1 hover:bg-white/10 rounded-full transition">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-lg font-bold tracking-wide">รายการโปรด</h1>
    </div>
    <div class="w-6"></div>
  </header>


  <!-- ================= MAIN CONTAINER ================= -->
  <main class="max-w-md md:max-w-4xl w-full mx-auto px-4 py-5 md:py-8 flex-1">

    <!-- Card Grid (2 Columns) -->
    <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-4">

      <!-- Dorm Card 1 -->
      <div class="bg-white rounded-2xl border border-gray-200/80 shadow-xs overflow-hidden flex flex-col justify-between hover:shadow-md transition">
        <!-- Image Placeholder -->
        <div class="w-full h-32 sm:h-40 bg-grayPlaceholder"></div>

        <!-- Card Body -->
        <div class="p-3 space-y-2.5 flex-1 flex flex-col justify-between">
          <div>
            <h2 class="font-bold text-gray-900 text-xs sm:text-sm">หอพักแสนสุข</h2>
            
            <!-- Tags -->
            <div class="flex flex-wrap gap-1 mt-2">
              <span class="bg-[#B2EBF2] text-gray-900 text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full">
                เลี้ยงแมวได้
              </span>
              <span class="bg-[#B2EBF2] text-gray-900 text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full">
                ใกล้ BTS
              </span>
            </div>
          </div>

          <!-- Price & Action Button -->
          <div class="flex items-center justify-between pt-1">
            <span class="text-[10px] sm:text-xs font-bold text-gray-900">6000 บาท/เดือน</span>
            <a href="detail.html?id=1" class="bg-[#2ECC71] hover:bg-emerald-600 text-white text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full transition active:scale-95 shrink-0">
              จองเลย
            </a>
          </div>
        </div>
      </div>

      <!-- Dorm Card 2 -->
      <div class="bg-white rounded-2xl border border-gray-200/80 shadow-xs overflow-hidden flex flex-col justify-between hover:shadow-md transition">
        <!-- Image Placeholder -->
        <div class="w-full h-32 sm:h-40 bg-grayPlaceholder"></div>

        <!-- Card Body -->
        <div class="p-3 space-y-2.5 flex-1 flex flex-col justify-between">
          <div>
            <h2 class="font-bold text-gray-900 text-xs sm:text-sm">หอพักสบายใจ</h2>
            
            <!-- Tags -->
            <div class="flex flex-wrap gap-1 mt-2">
              <span class="bg-[#B2EBF2] text-gray-900 text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full">
                เลี้ยงแมวได้
              </span>
              <span class="bg-[#B2EBF2] text-gray-900 text-[10px] sm:text-xs font-semibold px-2 py-0.5 rounded-full">
                ใกล้ เซนทรัล
              </span>
            </div>
          </div>

          <!-- Price & Action Button -->
          <div class="flex items-center justify-between pt-1">
            <span class="text-[10px] sm:text-xs font-bold text-gray-900">5000 บาท/เดือน</span>
            <a href="detail.html?id=2" class="bg-[#2ECC71] hover:bg-emerald-600 text-white text-[10px] sm:text-xs font-bold px-3 py-1 rounded-full transition active:scale-95 shrink-0">
              จองเลย
            </a>
          </div>
        </div>
      </div>

    </div>

  </main>


  <!-- ================= BOTTOM NAVIGATION BAR ================= -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-2 py-1.5 flex justify-around items-center z-50 shadow-lg">
    
    <a href="home.html" class="flex flex-col items-center justify-center text-black hover:text-primary transition">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span class="text-[10px] font-medium mt-0.5">หน้าหลัก</span>
    </a>

    <a href="matching.html" class="flex flex-col items-center justify-center text-black hover:text-primary transition">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <span class="text-[10px] font-medium mt-0.5">รูมเมท</span>
    </a>

    <a href="detail.html?id=1" class="flex flex-col items-center justify-center text-black hover:text-primary transition">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2L2 10h3v11h14V10h3L12 2zm-3 4.5h6v3.5H9V6.5zm6 12.5H9v-4.5h6v4.5z"/>
      </svg>
      <span class="text-[10px] font-medium mt-0.5">หอพัก</span>
    </a>

    <a href="messages.html" class="flex flex-col items-center justify-center text-black hover:text-primary transition">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.03 2 11c0 2.87 1.5 5.42 3.85 7.08L5 21l3.35-1.12C9.52 20.37 10.73 20.5 12 20.5c5.52 0 10-4.03 10-9.5S17.52 2 12 2zm-4 10c-.83 0-1.5-.67-1.5-1.5S7.17 9 8 9s1.5.67 1.5 1.5S8.83 12 8 12zm4 0c-.83 0-1.5-.67-1.5-1.5S11.17 9 12 9s1.5.67 1.5 1.5S12.83 12 12 12zm4 0c-.83 0-1.5-.67-1.5-1.5S15.17 9 16 9s1.5.67 1.5 1.5S16.83 12 16 12z"/>
      </svg>
      <span class="text-[10px] font-medium mt-0.5">ข้อความ</span>
    </a>

    <!-- Active Tab: ฉัน (Profile) -->
    <a href="profile.html" class="flex flex-col items-center justify-center text-primary">
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
      <span class="text-[10px] font-medium mt-0.5">ฉัน</span>
    </a>

  </div>

</body>
</html>
